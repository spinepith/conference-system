<aside class="app-sidebar" aria-label="Кабинет автора">
  <div class="app-sidebar__label">Кабинет автора</div>
  <nav>
    <a href="{% url 'author_dashboard' %}" class="{% if request.resolver_match.url_name == 'author_dashboard' or request.resolver_match.url_name == 'status' %}is-active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7V3Z"/><path d="M15 3v5h5M10 12h6M10 16h6"/></svg>
      Мои материалы
    </a>
    <a href="{% url 'conferences' %}">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v13H4V6Z"/><path d="M8 3v6M16 3v6M4 10h16"/></svg>
      Конференции
    </a>
    <a href="{% url 'submit' %}" class="{% if request.resolver_match.url_name == 'submit' %}is-active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Подать материал
    </a>
    <a href="{% url 'editorial:archive_index' %}">
      <svg viewBox="0 0 24 24"><path d="M4 7h16v13H4V7Zm2-3h12l2 3H4l2-3Z"/><path d="M9 11h6"/></svg>
      Архив
    </a>
  </nav>
  <div class="app-sidebar__profile">
    <span class="user-avatar">{{ user.get_full_name|default:user.username|slice:':1'|upper }}</span>
    <span><strong>{{ user.get_full_name|default:user.username }}</strong><small>Автор</small></span>
  </div>
</aside>
